# 质量门禁：方案 11.3 —— push 跑 go vet + 单测 + 前端构建。
# go:embed 依赖 web/dist，必须先构建前端再执行任何 Go 编译/测试。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建前端面板（go:embed 依赖）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./...
