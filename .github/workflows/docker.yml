# 自动构建 Docker 镜像并推送 Docker Hub（单仓库 singyoku/tarship，方案 11.3）。
# 触发：push 到 main（产出 edge + sha 标签）；推送 v* tag（产出 latest + 版本标签）。
# 所需 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（hub.docker.com → Account Settings → Security 生成）。
# M0 阶段仅构建 linux/amd64；arm64 待 M4 发版流水线（goreleaser + 多平台 manifest）再扩展。
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: singyoku/tarship
          # latest 永远指向最新稳定 Release（tag 构建）；
          # main 分支构建打 edge 标签（开发版），避免用户误拉未发布代码
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
